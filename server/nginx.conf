# Static serving for the HTML5 client.
#
# WHY THIS FILE EXISTS: nginx's default `gzip_types` is `text/html` and nothing
# else, so out of the box the two largest files a player downloads — a 38 MB
# `.wasm` and a 9.5 MB `.pck` — go over the wire uncompressed. The wasm alone
# compresses to about 10 MB.
#
# WHAT IS DELIBERATELY NOT HERE: Cross-Origin-Opener-Policy and
# Cross-Origin-Embedder-Policy. Godot's web export needs both only when thread
# support is on, and `export_presets.cfg` has `variant/thread_support=false` —
# which is why this can be served by any static file server with no special
# headers at all. If thread support is ever turned on, this file has to grow
# those two headers or the game will refuse to boot with a SharedArrayBuffer
# error.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # application/wasm is the engine, octet-stream is the .pck, and the rest is
    # the loader. Compressing on the fly costs CPU on every request; level 5 is
    # the usual knee, and a busy host should pre-compress and add
    # `gzip_static on` instead.
    gzip_types
        application/wasm
        application/octet-stream
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml;

    # The engine and the asset packs are content-addressed by the build, not by
    # a hash in the filename, so they must not be cached across a rebuild.
    location ~* \.(wasm|pck|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
